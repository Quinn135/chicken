    prim_path: /World/envs/env_.*/Robot/chicken/body
    update_period: 0.0
    history_length: 0
    debug_vis: false
    offset:
      pos:
      - 0.0
      - 0.0
      - 0.0
      rot:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
    visualizer_cfg:
      prim_path: /Visuals/Command/velocity_goal
      markers:
        arrow:
          func: isaaclab.sim.spawners.from_files.from_files:spawn_from_usd
          visible: true
          semantic_tags: null
          copy_from_source: true
          mass_props: null
          deformable_props: null
          rigid_props: null
          collision_props: null
          activate_contact_sensors: false
          scale:
          - 1.0
          - 0.1
          - 0.1
          articulation_props: null
          fixed_tendons_props: null
          spatial_tendons_props: null
          joint_drive_props: null
          visual_material_path: material
          visual_material:
            func: isaaclab.sim.spawners.materials.visual_materials:spawn_preview_surface
            diffuse_color:
            - 1.0
            - 0.0
            - 0.0
            emissive_color:
            - 0.0
            - 0.0
            - 0.0
            roughness: 0.5
            metallic: 0.0
            opacity: 1.0
          usd_path: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.1/Isaac/Props/UIElements/arrow_x.usd
          variants: null
    gravity_bias:
    - 0.0
    - 0.0
    - 9.81
  pos_range:
  - 0.8726646259971648
  - 2.0943951023931953
  - 2.0943951023931953
  - 0.6981317007977318
agent:
  seed: 420
  models:
    separate: false
    policy:
      class: GaussianMixin
      clip_actions: false
      clip_log_std: true
      min_log_std: -20.0
      max_log_std: 2.0
      initial_log_std: 0.0
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 256
        - 128
        - 64
        activations: elu
      output: ACTIONS
    value:
      class: DeterministicMixin
      clip_actions: false
      network:
      - name: net
        input: OBSERVATIONS
        layers:
        - 256
        - 128
        - 64
        activations: elu
      output: ONE
  memory:
    class: RandomMemory
    memory_size: -1
  agent:
    class: PPO
    rollouts: 32
    learning_epochs: 8
    mini_batches: 8
    discount_factor: 0.98
    gae_lambda: 0.95
    time_limit_bootstrap: true
    learning_rate: 0.0005
    learning_rate_scheduler: KLAdaptiveLR
    learning_rate_scheduler_kwargs:
      kl_threshold: 0.008
    observation_preprocessor: RunningStandardScaler
    observation_preprocessor_kwargs: null
    value_preprocessor: RunningStandardScaler
    value_preprocessor_kwargs: null
    random_timesteps: 0
    learning_starts: 100
    grad_norm_clip: 1.0
    ratio_clip: 0.2
    value_clip: 0.2
    entropy_loss_scale: 0.0001
    value_loss_scale: 1.0
    kl_threshold: 0.0
    rewards_shaper_scale: 0.1
    experiment:
      directory: chicken4
      experiment_name: v1
      write_interval: auto
      checkpoint_interval: auto
  trainer:
    class: SequentialTrainer
    timesteps: 20000
    environment_info: log
